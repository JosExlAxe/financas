<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador Financeiro</title>
    <style>
        :root { --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --primary: #2563eb; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 1.5rem; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 1000px; }
        header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 1.6rem; color: var(--primary); }
        .gerenciar-categorias { display: flex; gap: 0.5rem; background: var(--surface); padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem; align-items: center; flex-wrap: wrap; }
        .tabs { display: flex; gap: 0.25rem; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; }
        .tab { padding: 0.6rem 1rem; border: none; background: none; font-weight: 600; cursor: pointer; color: #64748b; }
        .tab.active { background: var(--primary); color: white; border-radius: 0.375rem 0.375rem 0 0; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem; display: none; }
        .panel.active { display: block; }
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .card-mes { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; border-top: 4px solid var(--primary); }
        .info-linha { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-gasto { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        input, select, button { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; font-size: 0.9rem; }
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: var(--bg); }
        .barra-progresso-container { background: #e2e8f0; height: 12px; border-radius: 6px; margin: 1rem 0; overflow: hidden; width: 100%; }
        .barra-progresso { background: var(--primary); height: 100%; width: 0%; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div>
                <h1>Finanças Pessoais</h1>
            </div>
            <div class="gerenciar-categorias">
                <input type="text" id="nova-categoria-input" placeholder="Nova categoria...">
                <button onclick="adicionarNovaCategoriaGlobal()" style="background: var(--success);">+ Criar Categoria</button>
                <button onclick="removerCategoriaGlobal()" style="background: var(--danger);">🗑️ Remover Categoria</button>
                <button onclick="resetarSistema()" style="background:#64748b; font-size: 0.8rem;">🔄 Resetar</button>
            </div>
        </header>
        <div class="tabs" id="tabs-container">
            <button class="tab active" id="tab-dashboard" onclick="switchTab('dashboard')">📊 Comparativo</button>
        </div>
        <div id="panels-container">
            <div id="panel-dashboard" class="panel active">
                <div class="grid-dashboard" id="grid-dashboard"></div>
            </div>
        </div>
    </div>

    <script>
        const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let appData = { db: {}, rendas: {}, categorias: ["Mercado", "Viagens", "Contas", "Diversos"] };
        
        try {
            let raw = localStorage.getItem('financas_solucao');
            if (raw) appData = JSON.parse(raw);
        } catch(e) { }

        meses.forEach(m => {
            if (!appData.db[m]) appData.db[m] = [];
            if (!appData.rendas[m]) appData.rendas[m] = 0;
        });

        function save() {
            try {
                localStorage.setItem('financas_solucao', JSON.stringify(appData));
            } catch(e) { }
            render();
        }

        function resetarSistema() {
            try {
                localStorage.clear();
            } catch(e) { }
            location.reload();
        }

        function switchTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            const panel = document.getElementById('panel-' + id);
            if (panel) panel.classList.add('active');
            
            const tabBtn = document.getElementById('tab-' + id);
            if (tabBtn) tabBtn.classList.add('active');
        }

        function addGasto(m) {
            const d = parseInt(document.getElementById(`d-${m}`).value) || 1;
            const desc = document.getElementById(`desc-${m}`).value || 'Gasto';
            const cat = document.getElementById(`cat-${m}`).value;
            const v = parseFloat(document.getElementById(`v-${m}`).value) || 0;
            
            if (v <= 0) return alert('Digite um valor válido');
            
            appData.db[m].push({ dia: d, desc, categoria: cat, valor: v });
            appData.db[m].sort((a,b) => a.dia - b.dia);
            
            document.getElementById(`d-${m}`).value = '';
            document.getElementById(`desc-${m}`).value = '';
            document.getElementById(`v-${m}`).value = '';
            
            save();
        }

        function atualizarSeletoresMeses() {
            meses.forEach(m => {
                const select = document.getElementById(`cat-${m}`);
                if (select) {
                    select.innerHTML = appData.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
                }
            });
        }

        function adicionarNovaCategoriaGlobal() {
            const input = document.getElementById('nova-categoria-input');
            const nomeCategoria = input.value.trim();
            
            if (!nomeCategoria) return alert('Digite um nome para a categoria');
            if (appData.categorias.includes(nomeCategoria)) return alert('Esta categoria já existe');
            
            appData.categorias.push(nomeCategoria);
            input.value = '';
            
            atualizarSeletoresMeses();
            save();
        }

        function removerCategoriaGlobal() {
            if (appData.categorias.length === 0) return alert('Não há categorias para remover');
            
            let listaTexto = appData.categorias.map((c, idx) => `${idx + 1} - ${c}`).join('\n');
            let escolha = prompt(`Digite o número da categoria que deseja remover:\n\n${listaTexto}`);
            
            if (escolha === null) return;
            
            let index = parseInt(escolha) - 1;
            if (isNaN(index) || index < 0 || index >= appData.categorias.length) return alert('Opção inválida');
            
            let removida = appData.categorias[index];
            if (confirm(`Tem certeza que deseja remover a categoria "${removida}"?`)) {
                appData.categorias.splice(index, 1);
                atualizarSeletoresMeses();
                save();
            }
        }

        function render() {
            const dash = document.getElementById('grid-dashboard');
            if (!dash) return;
            dash.innerHTML = '';

            meses.forEach(m => {
                const total = appData.db[m].reduce((acc, g) => acc + g.valor, 0);
                const renda = appData.rendas[m] || 0;
                const saldo = renda - total;
                let pct = renda > 0 ? Math.min((total / renda) * 100, 100) : 0;

                dash.innerHTML += `
                    <div class="card-mes">
                        <h3>${m}</h3>
                        <div class="info-linha" style="margin-top:0.5rem;"><span>Renda:</span> <span>R$ ${renda.toFixed(2)}</span></div>
                        <div class="info-linha"><span>Gastos:</span> <span style="color:var(--danger)">R$ ${total.toFixed(2)}</span></div>
                        <div class="info-linha"><span>Saldo:</span> <span style="color:green">R$ ${saldo.toFixed(2)}</span></div>
                        <div class="barra-progresso-container">
                            <div class="barra-progresso" style="width: ${pct}%; background-color: ${pct >= 100 ? 'var(--danger)' : 'var(--primary)'}"></div>
                        </div>
                    </div>`;

                const tbody = document.getElementById(`tbody-${m}`);
                if (tbody) {
                    tbody.innerHTML = appData.db[m].map(g => `<tr><td>${g.dia}</td><td>${g.desc}</td><td>${g.categoria}</td><td>R$ ${g.valor.toFixed(2)}</td></tr>`).join('');
                }
            });
        }

        const tc = document.getElementById('tabs-container');
        const pc = document.getElementById('panels-container');
        
        meses.forEach(m => {
            tc.innerHTML += `<button class="tab" id="tab-${m}" onclick="switchTab('${m}')">${m}</button>`;
            pc.innerHTML += `
                <div id="panel-${m}" class="panel">
                    <h2>${m}</h2>
                    <div class="form-gasto" style="margin: 1rem 0;">
                        Definir Renda: <input type="number" value="${appData.rendas[m]}" onchange="appData.rendas['${m}']=parseFloat(this.value)||0; save();" style="width:100px;">
                    </div>
